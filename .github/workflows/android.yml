name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agents/**'
      - '.claude/**'
      - '.github/workflows/pages.yaml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Free Disk Space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f || true
          echo "Disk space after cleanup:"
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: build-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Android Release Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo "Using signing keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
            {
              echo "keyAlias=${{ secrets.KEY_ALIAS }}"
              echo "storePassword=${{ secrets.STORE_PASSWORD }}"
              echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            } >> android/local.properties
          elif [ -f "android/app/keystore.jks" ]; then
            echo "Using committed persistent release keystore..."
            {
              echo "keyAlias=hclash"
              echo "storePassword=123456"
              echo "keyPassword=123456"
            } >> android/local.properties
          else
            echo "Generating persistent release keystore and committing to repository..."
            keytool -genkeypair -v \
              -keystore android/app/keystore.jks \
              -alias hclash \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass 123456 \
              -keypass 123456 \
              -dname "CN=hclash, OU=hclash, O=hclash, L=City, ST=State, C=US"
            {
              echo "keyAlias=hclash"
              echo "storePassword=123456"
              echo "keyPassword=123456"
            } >> android/local.properties
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f android/app/keystore.jks
            git commit -m "chore: persist release signing keystore for consistent app updates [skip ci]" || true
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main || true
          fi

      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          mkdir -p "$(dirname "$bundle")"
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Install dependencies
        run: |
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
          flutter pub get

      - name: Build Android APK (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
        run: |
          dart setup.dart android --arch arm64 --env stable -v

      - name: Generate Checksums
        run: |
          cd dist
          find . -name "*.apk" -type f -exec sha256sum {} + > sha256sum.txt
          cat sha256sum.txt

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hclash-android-apks
          path: dist/
          overwrite: true

      - name: Publish to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(sed -n 's/^version: *\([^ +]*\).*/\1/p' pubspec.yaml)
          [ -z "$VERSION" ] && VERSION="0.9.1"
          
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            # Auto-increment pre-release tag: v0.9.1-pre1, v0.9.1-pre2, ...
            EXISTING_PRES=$(gh release list --limit 100 2>/dev/null | grep -o "v${VERSION}-pre[0-9]*" | sed "s/v${VERSION}-pre//" | sort -n | tail -n 1 || true)
            if [ -z "$EXISTING_PRES" ]; then
              NEXT_PRE=1
            else
              NEXT_PRE=$((EXISTING_PRES + 1))
            fi
            TAG="v${VERSION}-pre${NEXT_PRE}"
          fi
          
          echo "Publishing release for tag: $TAG"
          
          # Flatten any nested APKs into dist/
          find dist -mindepth 2 -name "*.apk" -exec mv -f {} dist/ \; 2>/dev/null || true
          
          # Rename APKs to include tag version
          TAG_CLEAN="${TAG#v}"
          for f in dist/*.apk; do
            if [ -f "$f" ]; then
              base=$(basename "$f")
              new_base=$(echo "$base" | sed -E "s/([0-9]+\.[0-9]+\.[0-9]+)/${TAG_CLEAN}/")
              if [ "$base" != "$new_base" ]; then
                mv -f "$f" "dist/$new_base"
              fi
            fi
          done
          
          # Regenerate sha256sum with updated filenames
          cd dist
          rm -f sha256sum.txt
          find . -name "*.apk" -type f -exec sha256sum {} + > sha256sum.txt
          cd ..
          
          APK_FILES=$(find dist -maxdepth 1 -name "*.apk" -o -name "sha256sum.txt")
          echo "Files to upload:"
          echo "$APK_FILES"
          
          COMMIT_TITLE=$(git log -1 --pretty=%s)
          COMMIT_BODY=$(git log -1 --pretty=%b)
          
          echo "### 变更说明" > release_notes.md
          echo "**$COMMIT_TITLE**" >> release_notes.md
          echo "" >> release_notes.md
          echo "$COMMIT_BODY" >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "- **版本**: \`$TAG\`" >> release_notes.md
          echo "- **Commit**: \`${{ github.sha }}\`" >> release_notes.md
          
          echo "Creating new release $TAG..."
          if [[ "$TAG" == *-pre* ]]; then
            RELEASE_FLAG="--prerelease"
          else
            RELEASE_FLAG="--latest"
          fi
          gh release create "$TAG" $APK_FILES \
            --title "hclash $TAG" \
            --target "${{ github.sha }}" \
            --notes-file release_notes.md \
            $RELEASE_FLAG
