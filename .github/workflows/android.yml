name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agents/**'
      - '.claude/**'
      - '.github/workflows/pages.yaml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

permissions:
  contents: read

jobs:
  quality:
    name: Validate sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply Mihomo companion patch
        run: bash tool/apply_mihomo_patch.sh
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - name: Skip the Go core build hook for Dart tests
        run: yq -i '.hooks.user_defines.setup.build_assets = false' pubspec.yaml
      - run: dart run tool/test.dart -- --reporter expanded
      - run: dart run tool/hclash_regressions.dart
      - name: Go core tests and vet
        working-directory: core
        env:
          CGO_ENABLED: 0
        run: |
          go test -count=1 .
          go vet . ./cmd/...
      - name: Mihomo adapter regressions
        working-directory: core/Clash.Meta
        env:
          CGO_ENABLED: 0
        run: go test -count=1 ./adapter ./adapter/outboundgroup

  build-apk:
    name: Build Android APK
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f || true
          echo "Disk space after cleanup:"
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply Mihomo companion patch
        run: bash tool/apply_mihomo_patch.sh

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: build-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Android Release Keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE KEY_ALIAS STORE_PASSWORD KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required signing secret is missing: $name"
              exit 1
            fi
          done
          umask 077
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          keystore = Path('android/app/keystore.jks')
          encoded = ''.join(os.environ['KEYSTORE'].split())
          keystore.write_bytes(base64.b64decode(encoded, validate=True))
          if keystore.stat().st_size == 0:
              raise RuntimeError('Signing keystore is empty')

          # Java .properties escaping; values never become shell source.
          def escape(value):
              result = []
              for char in value:
                  if char == '\\': result.append('\\\\')
                  elif char == '\n': result.append('\\n')
                  elif char == '\r': result.append('\\r')
                  elif char == '\t': result.append('\\t')
                  elif char in ' :=#!': result.append('\\' + char)
                  elif ord(char) < 32 or ord(char) > 126:
                      raw = char.encode('utf-16-be')
                      result.extend('\\u' + raw[i:i + 2].hex() for i in range(0, len(raw), 2))
                  else: result.append(char)
              return ''.join(result)

          path = Path('android/local.properties')
          existing = path.read_text(encoding='utf-8') if path.exists() else ''
          keys = {'keyAlias', 'storePassword', 'keyPassword'}
          lines = [line for line in existing.splitlines()
                   if line.split('=', 1)[0].strip() not in keys]
          for key, name in [('keyAlias', 'KEY_ALIAS'),
                            ('storePassword', 'STORE_PASSWORD'),
                            ('keyPassword', 'KEY_PASSWORD')]:
              lines.append(key + '=' + escape(os.environ[name]))
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          keytool -list -keystore android/app/keystore.jks \
            -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null

      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          mkdir -p "$(dirname "$bundle")"
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Install dependencies
        run: |
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
          flutter pub get

      - name: Build Android APK (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
        run: |
          dart setup.dart android --arch arm64 --env stable -v

      - name: Android unit tests
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
        run: |
          wrapper="$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper"
          test -d "$wrapper" || flutter precache
          cp -R "$wrapper/." .
          chmod +x gradlew
          ./gradlew :common:testDebugUnitTest :service:testDebugUnitTest :app:testDebugUnitTest \
            -Ptarget-platform=android-arm64 \
            -x :app:compileFlutterBuildDebug -x :app:copyFlutterAssetsDebug

      - name: Generate Checksums
        run: |
          cd dist
          find . -name "*.apk" -type f -exec sha256sum {} + > sha256sum.txt
          cat sha256sum.txt

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hclash-android-apks
          path: dist/
          overwrite: true

  publish:
    name: Publish verified APK
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: hclash-release-publishing
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: hclash-android-apks
          path: dist

      - name: Publish to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(sed -n 's/^version: *\([^ +]*\).*/\1/p' pubspec.yaml)
          [ -z "$VERSION" ] && VERSION="0.9.1"
          
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            # Auto-increment pre-release tag: v0.9.1-pre1, v0.9.1-pre2, ...
            EXISTING_PRES=$(gh release list --limit 100 2>/dev/null | grep -o "v${VERSION}-pre[0-9]*" | sed "s/v${VERSION}-pre//" | sort -n | tail -n 1 || true)
            if [ -z "$EXISTING_PRES" ]; then
              NEXT_PRE=1
            else
              NEXT_PRE=$((EXISTING_PRES + 1))
            fi
            TAG="v${VERSION}-pre${NEXT_PRE}"
          fi
          
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Unsupported release tag format"
            exit 1
          fi
          echo "Publishing release for tag: $TAG"
          
          # Flatten any nested APKs into dist/
          find dist -mindepth 2 -name "*.apk" -exec mv -f {} dist/ \; 2>/dev/null || true
          
          # Rename APKs to include tag version
          TAG_CLEAN="${TAG#v}"
          for f in dist/*.apk; do
            if [ -f "$f" ]; then
              base=$(basename "$f")
              new_base=$(echo "$base" | sed -E "s/([0-9]+\.[0-9]+\.[0-9]+)/${TAG_CLEAN}/")
              if [ "$base" != "$new_base" ]; then
                mv -f "$f" "dist/$new_base"
              fi
            fi
          done
          
          # Regenerate sha256sum with updated filenames
          cd dist
          rm -f sha256sum.txt
          find . -name "*.apk" -type f -exec sha256sum {} + > sha256sum.txt
          cd ..
          
          APK_FILES=$(find dist -maxdepth 1 -name "*.apk" -o -name "sha256sum.txt")
          echo "Files to upload:"
          echo "$APK_FILES"
          
          COMMIT_TITLE=$(git log -1 --pretty=%s)
          COMMIT_BODY=$(git log -1 --pretty=%b)
          
          echo "### 变更说明" > release_notes.md
          echo "**$COMMIT_TITLE**" >> release_notes.md
          echo "" >> release_notes.md
          echo "$COMMIT_BODY" >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "- **版本**: \`$TAG\`" >> release_notes.md
          echo "- **Commit**: \`${{ github.sha }}\`" >> release_notes.md
          
          echo "Creating new release $TAG..."
          if [[ "$TAG" == *-pre* ]]; then
            RELEASE_FLAG="--prerelease"
          else
            RELEASE_FLAG="--latest"
          fi
          gh release create "$TAG" $APK_FILES \
            --title "hclash $TAG" \
            --target "${{ github.sha }}" \
            --notes-file release_notes.md \
            $RELEASE_FLAG
